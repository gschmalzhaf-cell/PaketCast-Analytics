name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle-Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.9
      - name: Keystore aus Secret dekodieren
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest
      - name: Signiertes Release bauen (APK + AAB)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PATH: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Test-Release bauen (Debug-APK, ohne Keystore)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: ./gradlew assembleDebug
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
