name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK einrichten (vorinstalliert auf dem Runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager nicht gefunden unter $SDK"; exit 1; fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle-Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.9
      - name: Keystore aus Secret dekodieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kein Keystore-Secret gesetzt – baue debug-signierte Test-APK."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest
      - name: Signiertes Release bauen (APK + AAB)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Test-Release bauen (Debug-APK, ohne Keystore)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: ./gradlew assembleDebug
      - name: Artefakte mit sprechendem Namen ablegen
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/PaketCast-Analytics-${VERSION}.apk"
          fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/PaketCast-Analytics-${VERSION}.aab"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/PaketCast-Analytics-${VERSION}-debug.apk"
          fi
          ls -la dist
      - name: Bestehendes Release zurücksetzen (saubere Asset-Liste)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --yes || true
      - name: Release-Notes aus CHANGELOG.md (Abschnitt des Tags)
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk -v tag="## [$TAG]" '
            $0 == tag { p = 1; next }
            /^## \[/ { if (p) exit }
            p { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::warning::Kein Changelog-Abschnitt für $TAG gefunden – Release-Notes leer. Bitte CHANGELOG.md pflegen (Abschnitt [Unreleased] via tools/release.sh)."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          body: ${{ steps.notes.outputs.body }}
